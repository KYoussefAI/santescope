name: Verifier la lecture des donnees AVC

on:
  push:
    branches: [main]
    paths:
      - scripts/01_exploration.R
      - scripts/02_variables.R
      - scripts/03_verification_taux.R
      - .github/workflows/exploration.yml
  workflow_dispatch:

jobs:
  exploration:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.3
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger les donnees officielles
        run: |
          Rscript -e 'dir.create("data", showWarnings = FALSE); download.file("https://odisse.santepubliquefrance.fr/api/explore/v2.1/catalog/datasets/accident-vasculaire-cerebral-incidence-hospitaliere-dep/exports/csv?lang=fr&use_labels=false", "data/avc_annual.csv", mode = "wb", method = "libcurl")'
      - name: Explorer le fichier avec R
        run: |
          Rscript scripts/01_exploration.R
          Rscript scripts/02_variables.R
          Rscript scripts/03_verification_taux.R
